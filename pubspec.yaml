name: quicklog
description: "Quicklog - jot timestamped markdown notes."
publish_to: 'none'

# <semver>+<buildNumber>. The build number is a plain counter -- bump it by one
# for every release, never reuse or lower it. It is deliberately NOT derived from
# the semver: `--split-per-abi` makes Flutter stamp buildNumber + 1000/2000/4000
# into the per-ABI APKs, so any scheme that lets the counter reach 1000 would
# eventually collide two different releases on the same APK versionCode, which
# F-Droid rejects and Android treats as the same build. v0.1.3 is release 8.
version: 0.1.3+8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - logo-small.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "icon.png"
