name: quicklog
description: "Quicklog - jot timestamped markdown notes."
publish_to: 'none'

# <semver>+<buildNumber>. The build number is a plain counter -- bump it by one
# for every release, never reuse or lower it. android/app/build.gradle.kts turns
# it into a per-ABI version code of `buildNumber * 10 + abi`, so it has no upper
# bound. v0.1.5 is release 10.
version: 0.1.5+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - logo-small.png

flutter_launcher_icons:
  android: true
  ios: false
  # Generated from the 600x600 logo, not the 64x64 icon.png: the xxxhdpi
  # foreground is 432x432, so a 64px source was upscaled ~7x and looked soft.
  image_path: "logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo.png"
