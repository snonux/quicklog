# Sizes the Gradle daemon JVM (Kotlin compile, D8/R8, in-process AAPT2). These
# are ceilings, not reservations. Kept small because F-Droid builds the release
# APKs, and fdroidserver's buildserver VM defaults to 1 CPU / 2048 MB
# (buildserver/Vagrantfile) -- the previous -Xmx8G was several times that.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
