# A pushed vX.Y.Z tag: build the three per-ABI release APKs with the release
# key and attach them to the GitHub release of that tag, under the names the
# F-Droid recipe's `binary:` URLs expect (app-<abi>-release.apk). snonux/fdroid
# serves them from there (within six hours, or at once when
# FDROID_DISPATCH_TOKEN is set), and official F-Droid diffs its own build
# against them.
#
# The build reproduces F-Droid's byte for byte only under the conditions in
# AGENTS.md, "Releasing": source in /tmp/build, Android SDK at
# /opt/android-sdk, the Flutter SDK from .flutter-version, and the pub cache
# inside the source tree. Every step below that looks odd is one of those.
#
# Secrets (see docs/fdroid-submission.md): ANDROID_KEYSTORE (base64 of
# keys/quicklog-release.jks), ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_PASSWORD; FDROID_DISPATCH_TOKEN is optional.
name: Release

on:
  push:
    tags: ['v*']
  # Rebuild the APKs of a tag that already exists, e.g. after fixing a secret.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.2.2
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FDROID_DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
  BUILD_DIR: /tmp/build

jobs:
  apk:
    name: Signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: The tag matches pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          name=${version%%+*}
          counter=${version##*+}
          if [ "v$name" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in pubspec.yaml"
            exit 1
          fi
          for abi in 1 2 3; do
            f="fastlane/metadata/android/en-US/changelogs/$((counter * 10 + abi)).txt"
            [ -s "$f" ] || echo "::warning::$f is missing, so F-Droid shows no changelog for this release"
          done
          echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      # F-Droid's builder uses JDK 17; Gradle 8.14 rejects 25+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.version.outputs.flutter }}
          channel: stable

      - name: Source in /tmp/build, SDK at /opt/android-sdk
        run: |
          rm -rf "$BUILD_DIR"
          cp -a "$GITHUB_WORKSPACE" "$BUILD_DIR"
          sudo ln -sfn "$ANDROID_HOME" /opt/android-sdk
          # ANDROID_HOME alone is not enough: flutter writes sdk.dir into
          # android/local.properties from its own config.
          flutter config --no-analytics --android-sdk /opt/android-sdk
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$BUILD_DIR/.pub-cache" >> "$GITHUB_ENV"

      - name: Restore the release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::The ANDROID_* signing secrets are not all set; see docs/fdroid-submission.md"
            exit 1
          fi
          keystore="$RUNNER_TEMP/quicklog-release.jks"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > "$BUILD_DIR/android/key.properties"
          chmod 600 "$BUILD_DIR/android/key.properties"

      - name: flutter build apk --split-per-abi
        working-directory: /tmp/build
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi
          grep -q '^sdk.dir=/opt/android-sdk$' android/local.properties || {
            echo "::error::sdk.dir is not /opt/android-sdk, so the build will not reproduce:"
            cat android/local.properties
            exit 1
          }

      - name: Signed with the release key, not the debug key
        working-directory: /tmp/build
        run: |
          apksigner=$(ls /opt/android-sdk/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$apk: $certs"
            if echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      # A release written by hand before the tag was pushed keeps its notes.
      - name: Attach the APKs to the release
        working-directory: /tmp/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber build/app/outputs/flutter-apk/app-*-release.apk

      - name: Refresh the F-Droid repo now
        if: env.FDROID_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.FDROID_DISPATCH_TOKEN }}
        run: gh api repos/snonux/fdroid/dispatches -f event_type=app-release

      - name: Forget the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/quicklog-release.jks" "$BUILD_DIR/android/key.properties"
