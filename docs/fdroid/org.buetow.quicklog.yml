Builds:
  - versionName: 0.1.5
    versionCode: 101
    commit: ba0f75336b44126e04eb3bc9a744fdab6c6c99f0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/snonux/quicklog/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - linux
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cd ..
      - mv org.buetow.quicklog /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv /tmp/build org.buetow.quicklog
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv org.buetow.quicklog /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv /tmp/build org.buetow.quicklog

